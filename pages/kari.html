<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страничка Карины</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="kari-theme">
    <header class="person-header">
        <img src="../images/kara/ava.jpg" alt="Карина" class="avatar">
        <div>
            <h1>Карина</h1>
                <p>знак зодиака: Козерог</p>
                <p>любимые цвета: жёлтый и бордовый</p>
                <p>любимый мем: ммм салатик</p>
                <p>"О да, жизнь - это серьезно! Но не очень..."
                    Играю на двух музыкальных инструментах, рисую, учусь и мечтаю научиться ходить на руках
                </p>
            </p>
        </div>
    </header>

    <div class="carousel-window">
        <div id="slides" class="slides">
            <img src="../images/kara/1.jpg" alt="Фото 1" class="slide" data-caption="Это я отобрала балалайку у деда в лесу">
            <img src="../images/kara/2.jpg" alt="Фото 2" class="slide" data-caption="Нишевый хогвартс-хостел">
            <img src="../images/kara/3.jpg" alt="Фото 3" class="slide" data-caption="ваду">
            <img src="../images/kara/4.jpg" alt="Фото 4" class="slide" data-caption="Я ещё рисовать типо умею прикиньте">
            <img src="../images/kara/5.jpg" alt="Фото 5" class="slide" data-caption="Кошка в тазике">
        </div>
    </div>
    <p id="slide-caption" class="slide-caption"></p>
    <div class="carousel-controls">
        <button id="prev-photo">←</button>
        <button id="next-photo">→</button>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
