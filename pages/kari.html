<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страничка Карины</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="person-header">
        <img src="../images/kara_ava.jpg" alt="Карина" class="avatar">
        <div>
            <h1>Карина</h1>
            <p>Охаешечки датебаешечки это моя каваи страница (тут ваш мини рассказ о себе в целом, потом поменяю на что-то нормальное, вы тоже меняйте пж)</p>
        </div>
    </header>

    <div class="carousel-window">
        <div id="slides" class="slides">
            <img src="../images/kara/1.jpg" alt="Фото 1" class="slide" data-caption="Мой стул">
            <img src="../images/kara/2.jpg" alt="Фото 2" class="slide" data-caption="Мой стол">
            <img src="../images/kara/3.jpg" alt="Фото 3" class="slide" data-caption="Ракушка">
            <img src="../images/kara/4.jpg" alt="Фото 4" class="slide" data-caption="Ананас">
            <img src="../images/kara/5.jpg" alt="Фото 5" class="slide" data-caption="Кошка в тазике">
        </div>
    </div>
    <p id="slide-caption" class="slide-caption"></p>
    <div class="carousel-controls">
        <button id="prev-photo">←</button>
        <button id="next-photo">→</button>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
