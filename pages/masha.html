<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страничка Маши</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="masha-theme">
    <header class="person-header">
        <!-- ЗДЕСЬ ПОТОМ ЗАМЕНИШЬ НА СВОЮ ФОТОГРАФИЮ -->
        <img src="../images/masha/1.jpg" alt="Маша" class="avatar">
        <div>
            <h1>Маша</h1>
            <p>
                <p>знак зодиака: Стрелец</p>
                <p>любимый цвет: Розовый</p>
                <p>любимые числа: 24</p>
                <p>С детства занималась танцами и окончила музыкальную школу с красным дипломом. В свободное время люблю слушать корейскую музыку и играть в Майнкрафт. Мечтаю постетить все страны мира!</p>
            </p>
        </div>
    </header>

    <div class="carousel-window">
        <div id="slides" class="slides">
            <!-- ЗДЕСЬ ПОТОМ ЗАМЕНИШЬ КАРТИНКИ НА СВОИ -->
            <img src="../images/masha/2.jpg" alt="Фото 1" class="slide" data-caption="Красивое фото">
            <img src="../images/masha/3.jpg" alt="Фото 2" class="slide" data-caption="Я с цветочками">
            <img src="../images/masha/4.jpg" alt="Фото 3" class="slide" data-caption="Я на фотосессии">
        </div>
    </div>
    <p id="slide-caption" class="slide-caption"></p>
    <div class="carousel-controls">
        <button id="prev-photo">←</button>
        <button id="next-photo">→</button>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
